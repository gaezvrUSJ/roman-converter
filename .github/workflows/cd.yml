name: Continuous Delivery

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run tests with headless browser
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
        npm install mocha puppeteer
        node -e "
        const puppeteer = require('puppeteer');
        (async () => {
          const browser = await puppeteer.launch({
            executablePath: '/usr/bin/chromium-browser',
            args: ['--no-sandbox', '--disable-setuid-sandbox']
          });
          const page = await browser.newPage();
          console.log('Loading test page...');
          await page.goto('file://' + process.cwd() + '/test.html', {waitUntil: 'networkidle0'});
          
          console.log('Waiting for tests to complete...');
          await page.waitForFunction(
            'document.querySelector && document.querySelector(\"#mocha\") && (document.querySelector(\"#mocha\").innerText.includes(\"passing\") || document.querySelector(\"#mocha\").innerText.includes(\"failing\"))',
            {timeout: 30000}
          );
          
          const results = await page.evaluate(() => {
            const text = document.querySelector('#mocha').innerText;
            const passes = (text.match(/(\d+) passing/g) || ['0 passing'])[0];
            const failures = (text.match(/(\d+) failing/g) || ['0 failing'])[0];
            return { text, passes, failures };
          });
          
          console.log('Results:', results.text);
          
          if (results.failures !== '0 failing') {
            console.log('Tests failed:', results.failures);
            process.exit(1);
          }
          
          console.log('All tests passed:', results.passes);
          await browser.close();
        })();
        "
    
    - name: Deploy to GitHub Pages
      if: success()
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        publish_branch: gh-pages
