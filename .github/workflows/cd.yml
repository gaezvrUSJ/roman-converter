name: Continuous Delivery

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install ESLint
      run: npm install -g eslint
    
    - name: Run ESLint
      run: eslint script.js --no-eslintrc --env browser --env node
    
    - name: Run Tests
      run: |
        npm install -g mocha
        npm install -g jsdom
        npm install -g jsdom-global
        npx mocha --no-config --timeout 5000 test.html
      continue-on-error: false
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./
        publish_branch: gh-pages
