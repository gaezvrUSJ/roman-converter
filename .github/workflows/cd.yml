name: Continuous Delivery

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:

    - name: Basic linting
      run: node -c script.js
    

    - name: Run tests with headless browser
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
        npm install mocha puppeteer
     

    - name: Deploy to GitHub Pages
      if: success()
      uses: peaceiris/actions-gh-pages@v4
