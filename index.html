<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Number Converter</title>
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-752YM73XXB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-752YM73XXB');
  </script>
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

<body>
  <div class="container">
    <h1>Number Converter</h1>

    <select id="conversionMode">
      <option value="intToRoman">Integer to Roman</option>
      <option value="romanToInt">Roman to Integer</option>
    </select>

    <input type="text" id="inputValue" placeholder="Enter value" />
    <button id="convertButton">Convert</button>

    <div class="result" id="result"></div>
    <div class="error" id="error"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
